<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Resource Navigator</title>
</head>
<body>
  <header>
    <h1>Student Resource Navigator</h1>
    <p>
      This site links to official Texas State University resources
      but does not provide official advice.
    </p>
  </header>

  <main>
    <form id="search-form">
      <label for="search">Search resources</label>
      <input
        type="search"
        id="search"
        name="q"
        placeholder="Enter a keyword"
      >

      <label for="category">Category</label>
      <select id="category" name="category">
        <option value="">All categories</option>
      </select>

      <button type="submit">Search</button>
    </form>
    <section aria-labelledby="results-heading">
     <h2 id="results-heading">Resources</h2>

     <p id="results-status" role="status">
      Search or choose a category to see resources.
     </p>

     <div id="results"></div>
  </section>
  </main>

 <script type="module" src="results.js"></script>
 <script type="module" src="search.js"></script>

  <script>
    document.getElementById("search-form").addEventListener("submit", function (event) {
      event.preventDefault();
    });
  </script>
</body>
</html>
